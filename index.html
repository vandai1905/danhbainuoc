<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính Điểm Bài Nước - Bảng ván</title>
    <style>
        :root{font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;}
        body{margin:0;background:#f3f6fb;padding:12px}
        .container{max-width:980px;margin:0 auto;background:#fff;border-radius:10px;padding:12px;box-shadow:0 6px 18px rgba(0,0,0,0.08)}
        .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
        h1{font-size:18px;margin:6px 0}
        .controls{display:flex;gap:8px;align-items:center}
        .btn{background:#2b6cb0;color:#fff;border:none;padding:8px 10px;border-radius:8px;cursor:pointer}
        .btn.ghost{background:#edf2f7;color:#2b6cb0}
        .settings{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
        .settings label{font-size:12px;color:#334155}
        .settings input[type=number]{width:84px;padding:6px;border-radius:6px;border:1px solid #e2e8f0}
        .placement-btns{display:flex;gap:4px;margin-bottom:4px}
        .placement-btns .btn.small{padding:4px 6px}
        .cell-controls select{width:100%;margin:2px 0}

        table{width:100%;border-collapse:collapse;margin-top:8px}
        thead th{background:#f8fafc;padding:8px;border-bottom:2px solid #e2e8f0;text-align:center;font-size:13px}
        tbody td{padding:6px;border-bottom:1px solid #eef2f7;text-align:center}
        .player-name{width:100%;padding:6px;border:1px dashed #cbd5e1;border-radius:6px}

        .cell-controls{display:flex;flex-direction:column;gap:6px;align-items:center}
        .small{font-size:12px}
        .round-actions{display:flex;gap:6px;justify-content:center}
        .totals{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
        .total-item{background:#f8fafc;padding:8px;border-radius:8px;flex:1;min-width:140px;text-align:center}
        @media(max-width:720px){.settings input[type=number]{width:64px}}
    </style>
</head>
<body>
    <div class="container">
        <div class="top">
            <div>
                <h1>📋 Bảng ván - Ghi điểm nhanh / Chọn về nhất/nhì/ba/bét</h1>
                <div class="settings" id="settingsPanel" style="display:none">
                    <label class="small">1st <input id="pt1" type="number" value="3"></label>
                    <label class="small">2nd <input id="pt2" type="number" value="2"></label>
                    <label class="small">3rd <input id="pt3" type="number" value="1"></label>
                    <label class="small">4th <input id="pt4" type="number" value="0"></label>
                    <label class="small">Điểm kết thúc <input id="endScore" type="number" value="0"></label>
                    <div style="width:100%;margin-top:6px;font-size:12px;color:#334155">Tên loại thúi (giá trị):</div>
                    <label class="small">1 <input id="thName1" placeholder="" value="Thúi 2♥️" style="width:80px"> <input id="thVal1" type="number" value="0" style="width:60px"></label>
                    <label class="small">2 <input id="thName2" placeholder="" value="Thúi 2♦️" style="width:80px"> <input id="thVal2" type="number" value="0" style="width:60px"></label>
                    <label class="small">3 <input id="thName3" placeholder="" value="Thúi 2♣️" style="width:80px"> <input id="thVal3" type="number" value="0" style="width:60px"></label>
                    <label class="small">4 <input id="thName4" placeholder="" value="Thúi 2♠️" style="width:80px"> <input id="thVal4" type="number" value="0" style="width:60px"></label>
                    <div style="width:100%;margin-top:6px;font-size:12px;color:#334155">Tên loại chặt (giá trị):</div>
                    <label class="small">1 <input id="chName1" placeholder="" value="Chặt 2♥️" style="width:80px"> <input id="chVal1" type="number" value="0" style="width:60px"></label>
                    <label class="small">2 <input id="chName2" placeholder="" value="Chặt 2♦️" style="width:80px"> <input id="chVal2" type="number" value="0" style="width:60px"></label>
                    <label class="small">3 <input id="chName3" placeholder="" value="Chặt 2♣️" style="width:80px"> <input id="chVal3" type="number" value="0" style="width:60px"></label>
                    <label class="small">4 <input id="chName4" placeholder="" value="Chặt 2♠️" style="width:80px"> <input id="chVal4" type="number" value="0" style="width:60px"></label>
                </div>
            </div>
            <div class="controls">
                <button class="btn" id="addRoundBtn">➕ Thêm ván</button>
                <button class="btn ghost" id="recalcBtn">🔁 Tính lại</button>
                <button class="btn ghost" id="clearRoundsBtn">🗑️ Xóa ván</button>
                <button class="btn ghost" id="settingsToggle">⚙️ Cài đặt</button>
            </div>
        </div>

        <table id="roundsTable">
            <thead>
                <tr id="playersHeader">
                    <th>Ván</th>
                    <th><input id="name-player1" class="player-name" value="Người 1"></th>
                    <th><input id="name-player2" class="player-name" value="Người 2"></th>
                    <th><input id="name-player3" class="player-name" value="Người 3"></th>
                    <th><input id="name-player4" class="player-name" value="Người 4"></th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody id="roundsBody">
            </tbody>
        </table>

        <div class="totals" id="totals"></div>
    </div>

    <script>
        const STORAGE_KEY = 'bainuoc_rounds_v2';
        const PLAYERS = ['player1','player2','player3','player4'];

        // configuration helpers
        function readPenaltyConfig(prefix){
            const arr=[];
            for(let i=1;i<=4;i++){
                const nameEl = document.getElementById(prefix+"Name"+i);
                const valEl = document.getElementById(prefix+"Val"+i);
                arr.push({name: nameEl? nameEl.value : '', val: valEl? Number(valEl.value) : 0});
            }
            return arr;
        }
        function getPlacementPoints(){
            return {
                '1': Number(document.getElementById('pt1').value)||0,
                '2': Number(document.getElementById('pt2').value)||0,
                '3': Number(document.getElementById('pt3').value)||0,
                '4': Number(document.getElementById('pt4').value)||0
            };
        }
        function getEndScore(){
            return Number(document.getElementById('endScore').value)||0;
        }

        let rounds = [];

        function save(){
            const names = {};
            PLAYERS.forEach(p=>names[p]=document.getElementById('name-'+p).value||p);
            const data = {
                rounds,
                names,
                pts:getPlacementPoints(),
                endScore:getEndScore(),
                thConfig: readPenaltyConfig('th'),
                chConfig: readPenaltyConfig('ch')
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function load(){
            const s = localStorage.getItem(STORAGE_KEY);
            if(!s) return;
            try{
                const data = JSON.parse(s);
                rounds = data.rounds || [];
                if(data.names) PLAYERS.forEach(p=>document.getElementById('name-'+p).value = data.names[p] || document.getElementById('name-'+p).value);
                if(data.pts){document.getElementById('pt1').value=data.pts['1'];document.getElementById('pt2').value=data.pts['2'];document.getElementById('pt3').value=data.pts['3'];document.getElementById('pt4').value=data.pts['4'];}
                if(data.endScore!==undefined){document.getElementById('endScore').value=data.endScore;}
                if(data.thConfig){
                    data.thConfig.forEach((c,i)=>{
                        if(document.getElementById('thName'+(i+1))) document.getElementById('thName'+(i+1)).value=c.name;
                        if(document.getElementById('thVal'+(i+1))) document.getElementById('thVal'+(i+1)).value=c.val;
                    });
                }
                if(data.chConfig){
                    data.chConfig.forEach((c,i)=>{
                        if(document.getElementById('chName'+(i+1))) document.getElementById('chName'+(i+1)).value=c.name;
                        if(document.getElementById('chVal'+(i+1))) document.getElementById('chVal'+(i+1)).value=c.val;
                    });
                }
            }catch(e){console.warn('load error',e)}
        }

        function addRound(){
            const idx = rounds.length+1;
            const row = {id:Date.now(), note:'', players:{}, history:[]};
            PLAYERS.forEach(p=> row.players[p] = {placement:'', manual:null, thType:'', chType:''});
            rounds.push(row);
            renderRounds();
            save();
        }

        function removeRound(id){
            rounds = rounds.filter(r=>r.id!==id);
            renderRounds();
            save();
        }

        function renderRounds(){
            const body = document.getElementById('roundsBody');
            body.innerHTML='';
            const thConfig = readPenaltyConfig('th');
            const chConfig = readPenaltyConfig('ch');
            rounds.forEach((r,i)=>{
                const tr=document.createElement('tr');
                // clicking row saves history of that round
                tr.addEventListener('click', ()=>{
                    const roundScores={};
                    const pts=getPlacementPoints();
                    const thConfig=readPenaltyConfig('th');
                    const chConfig=readPenaltyConfig('ch');
                    PLAYERS.forEach(p=>{
                        const cell=r.players[p];
                        let v=0;
                        if(cell.manual!==null) v=Number(cell.manual)||0;
                        else if(cell.placement) v=Number(pts[cell.placement])||0;
                        let thName='';
                        let chName='';
                        if(cell.thType!==''){
                            const idx=Number(cell.thType);
                            v += thConfig[idx]?.val||0;
                            thName = thConfig[idx]?.name || '';
                        }
                        if(cell.chType!==''){
                            const idx=Number(cell.chType);
                            v += chConfig[idx]?.val||0;
                            chName = chConfig[idx]?.name || '';
                        }
                        roundScores[p]={score:v, placement:cell.placement, th:thName, ch:chName};
                    });
                    r.history = r.history || [];
                    r.history.push(roundScores);
                    // build display string
                    const display = PLAYERS.map(p=>{
                        const n = document.getElementById('name-'+p).value;
                        const info = roundScores[p];
                        let s = n+':'+info.score;
                        if(info.placement) s+=' (về '+info.placement+')';
                        if(info.th) s+=' [thúi:'+info.th+']';
                        if(info.ch) s+=' [chặt:'+info.ch+']';
                        return s;
                    }).join(', ');
                    alert('Ván '+(i+1)+' điểm: '+display+"\nLịch sử: "+JSON.stringify(r.history));
                });
                const tdIndex=document.createElement('td');
                tdIndex.className='small'; tdIndex.textContent=i+1;
                tr.appendChild(tdIndex);
                PLAYERS.forEach(p=>{
                    const cell=r.players[p];
                    const td=document.createElement('td');
                    const wrapper=document.createElement('div'); wrapper.className='cell-controls';
                    // placement buttons
                    const divPlacement=document.createElement('div'); divPlacement.className='placement-btns';
                    for(let num=1;num<=4;num++){
                        const btn=document.createElement('button');
                        btn.className='btn small'; btn.textContent=num;
                        btn.dataset.player=p; btn.dataset.id=r.id; btn.dataset.type='placement'; btn.dataset.value=num;
                        if(cell.placement==String(num)) btn.style.fontWeight='700';
                        const disabled=PLAYERS.some(other=>other!==p && r.players[other].placement==String(num));
                        if(disabled) btn.disabled=true;
                        divPlacement.appendChild(btn);
                    }
                    wrapper.appendChild(divPlacement);
                    // th select
                    const selTh=document.createElement('select'); selTh.className='small';
                    selTh.dataset.player=p; selTh.dataset.id=r.id; selTh.dataset.type='th';
                    selTh.appendChild(new Option('-', ''));
                    thConfig.forEach((opt,idx)=>{
                        const o=new Option(opt.name, idx);
                        if(cell.thType==String(idx)) o.selected=true;
                        selTh.appendChild(o);
                    });
                    wrapper.appendChild(selTh);
                    // ch select
                    const selCh=document.createElement('select'); selCh.className='small';
                    selCh.dataset.player=p; selCh.dataset.id=r.id; selCh.dataset.type='ch';
                    selCh.appendChild(new Option('-', ''));
                    chConfig.forEach((opt,idx)=>{
                        const o=new Option(opt.name, idx);
                        if(cell.chType==String(idx)) o.selected=true;
                        selCh.appendChild(o);
                    });
                    wrapper.appendChild(selCh);
                    // manual input
                    const inp=document.createElement('input'); inp.type='number'; inp.placeholder='Ghi điểm';
                    inp.className='manual small'; inp.dataset.player=p; inp.dataset.id=r.id; inp.dataset.type='manual';
                    if(cell.manual!==null) inp.value=cell.manual;
                    wrapper.appendChild(inp);
                    td.appendChild(wrapper);
                    tr.appendChild(td);
                });
                const tdAct=document.createElement('td'); tdAct.className='round-actions';
                const btnRem=document.createElement('button'); btnRem.className='btn ghost'; btnRem.textContent='Xóa';
                btnRem.onclick=()=>removeRound(r.id);
                tdAct.appendChild(btnRem);
                tr.appendChild(tdAct);
                body.appendChild(tr);
            });
            attachRowListeners();
            recalcTotals();
        }

        function attachRowListeners(){
            // placement buttons
            document.querySelectorAll('button[data-type="placement"]').forEach(btn=>{
                btn.onclick = e=>{
                    const id = Number(e.target.dataset.id);
                    const p = e.target.dataset.player;
                    const val = e.target.dataset.value;
                    const r = rounds.find(rr=>rr.id===id);
                    r.players[p].placement = r.players[p].placement===val ? '' : val;
                    if(r.players[p].placement) r.players[p].manual = null;
                    save(); renderRounds();
                };
            });
            // selects for th and ch
            document.querySelectorAll('select[data-type="th"]').forEach(sel=>{
                sel.onchange = e=>{
                    const id = Number(e.target.dataset.id);
                    const p = e.target.dataset.player;
                    const r = rounds.find(rr=>rr.id===id);
                    r.players[p].thType = e.target.value;
                    save(); recalcTotals();
                };
            });
            document.querySelectorAll('select[data-type="ch"]').forEach(sel=>{
                sel.onchange = e=>{
                    const id = Number(e.target.dataset.id);
                    const p = e.target.dataset.player;
                    const r = rounds.find(rr=>rr.id===id);
                    r.players[p].chType = e.target.value;
                    save(); recalcTotals();
                };
            });
            // manual inputs
            document.querySelectorAll('.manual').forEach(inp=>inp.oninput = (e)=>{
                const id = Number(e.target.dataset.id);
                const p = e.target.dataset.player;
                const r = rounds.find(rr=>rr.id===id);
                const v = e.target.value.trim();
                r.players[p].manual = v === '' ? null : Number(v);
                if(r.players[p].manual !== null) r.players[p].placement = '';
                save(); recalcTotals();
            });
        }

        function recalcTotals(){
            const pts = getPlacementPoints();
            const endScore = getEndScore();
            const thConfig = readPenaltyConfig('th');
            const chConfig = readPenaltyConfig('ch');
            const totals = {};
            PLAYERS.forEach(p=>totals[p]=0);
            rounds.forEach(r=>{
                PLAYERS.forEach(p=>{
                    const cell = r.players[p];
                    let v = 0;
                    if(cell.manual !== null){ v = Number(cell.manual) || 0; }
                    else if(cell.placement){ v = Number(pts[cell.placement]) || 0; }
                    if(cell.thType !== ''){
                        const idx=Number(cell.thType);
                        v += thConfig[idx]?.val||0;
                    }
                    if(cell.chType !== ''){
                        const idx=Number(cell.chType);
                        v += chConfig[idx]?.val||0;
                    }
                    totals[p] += v;
                });
            });
            renderTotals(totals);
            // auto-add round if nobody reached end score and last round not empty
            if(endScore>0){
                const maxScore = Math.max(...Object.values(totals));
                const last = rounds[rounds.length-1];
                const emptyLast = last && PLAYERS.every(p=>{
                    const c=last.players[p];
                    return c.placement==='' && c.manual===null && c.thType==='' && c.chType==='' ;
                });
                if(maxScore < endScore && !emptyLast){
                    addRound();
                }
            }
        }

        function renderTotals(totals){
            const container = document.getElementById('totals');
            container.innerHTML = '';
            PLAYERS.forEach(p=>{
                const name = document.getElementById('name-'+p).value || p;
                const div = document.createElement('div');
                div.className = 'total-item';
                div.innerHTML = `<div class="small">${name}</div><div style="font-weight:700;font-size:20px">${totals[p]}</div>`;
                container.appendChild(div);
            });
        }

        // UI buttons
        document.getElementById('addRoundBtn').onclick = ()=>{ addRound(); };
        document.getElementById('recalcBtn').onclick = ()=>{ recalcTotals(); save(); };
        document.getElementById('clearRoundsBtn').onclick = ()=>{ if(confirm('Xóa mọi ván?')){ rounds=[]; renderRounds(); save(); }};
        document.getElementById('settingsToggle').onclick = ()=>{
            const panel = document.getElementById('settingsPanel');
            panel.style.display = panel.style.display==='none'?'flex':'none';
        };

        // Save on various configuration changes
        document.querySelectorAll('.player-name').forEach(inp=>inp.onchange = ()=>save());
        ['pt1','pt2','pt3','pt4','endScore'].forEach(id=>{
            const el=document.getElementById(id);
            if(el) el.onchange = ()=>{ save(); recalcTotals(); };
        });
        // penalty config inputs
        Array.from({length:4},(_,i)=>i+1).forEach(i=>{
            ['thName','thVal','chName','chVal'].forEach(pref=>{
                const el=document.getElementById(pref+i);
                if(el) el.onchange = ()=>{ save(); recalcTotals(); };
            });
        });

        // Init
        window.addEventListener('DOMContentLoaded', ()=>{
            load();
            if(rounds.length===0) addRound();
            renderRounds();
        });
    </script>
</body>
</html>
